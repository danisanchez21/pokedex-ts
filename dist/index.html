<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon API</title>
  <link rel="stylesheet" href="output.css" />
</head>
<body class="bg-gradient-to-b from-blue-50 to-white min-h-screen">

  <h1 class="text-3xl font-bold bg-yellow-300 text-yellow-600">¡Hola, Pokédex!</h1>
  
  <!-- Buscador de pokémon por nombres -->
  <input type="text" id="searchInput" placeholder="Buscar Pokémon por nombre..." autocomplete="off" class="w-full max-w-xs mx-auto my-4 px-4 py-2 border rounded-md shadow-md"/>
  
  <p id="no-results" class="text-center text-red-600 font-semibold mt-4 hidden">
    No se encontraron Pokémon con ese nombre.
  </p>
  
  <!-- Contenedor para los botones de tipo -->
  <div
  id="type-filter"
  class="flex flex-wrap gap-3 justify-center mt-2 mb-2 p-5 bg-gray-100 rounded-xl shadow-md"
></div>


  <!-- Contenedor de tarjetas Pokémon con estilos Tailwind -->
  <div id="pokemon-container" class="mt-10 flex flex-wrap justify-center gap-6 px-4">
  </div>

  <script type="module" src="../javascript/main.js"></script>
</body>
</html>
